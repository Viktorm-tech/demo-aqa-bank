name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Clone the test repository (demo-aqa-bank)
      - name: Checkout test repository
        uses: actions/checkout@v4

      # 2. Clone the banking-api service repository into a separate directory
      - name: Checkout banking-api
        uses: actions/checkout@v4
        with:
          repository: Viktorm-tech/banking-api
          path: banking-api

      # 3. Set up JDK 21 (used both for banking-api build and test execution)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Set up Docker Compose !!!
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      # 4. Launch core services of banking-api
      - name: Start banking-api services
        working-directory: ./banking-api
        run: |
          docker compose up -d --build
          # Wait until the API health endpoint is reachable
          timeout 600 sh -c 'until curl -s -o /dev/null http://localhost:8080/api/accounts; do sleep 2; done'

      - name: Show banking-api logs on failure
        if: failure()
        working-directory: ./banking-api
        run: docker compose logs

      # 5. Start WireMock (from demo-aqa-bank) to mock the limit-checking service
      - name: Start WireMock
        run: |
          docker compose -f docker-compose.yml up -d wiremock
          # Wait until WireMock is ready
          timeout 30 sh -c 'until curl -s -f -o /dev/null http://localhost:8081/__admin/health; do sleep 2; done'

      # 6. Reconfigure banking-api to point to the WireMock instance for limit checks
      #    This overrides the LIMITS_CHECK_URL environment variable and restarts the container.
      - name: Reconfigure banking-api to use WireMock
        working-directory: ./banking-api
        run: |
          docker compose up -d -e LIMITS_CHECK_URL=http://172.17.0.1:8081/limits/check --force-recreate banking-api
          # Wait for the API to restart and become healthy
          timeout 60 sh -c 'until curl -s -o /dev/null http://localhost:8080/api/accounts; do sleep 2; done'

      # 7. Run tests (Maven) from the java-framework module
      - name: Run tests
        working-directory: ./java-framework
        run: mvn clean test

      # 8. Generate Allure report using the Maven plugin
      - name: Generate Allure report
        working-directory: ./java-framework
        run: mvn allure:report

      # 9. Upload the generated Allure report as a build artifact
      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: java-framework/target/site/allure-maven-plugin/

      # 10. Always stop containers, even if tests fail, to free runner resources
      - name: Stop containers
        if: always()
        run: |
          docker compose -f docker-compose.yml down
          docker compose -f ./banking-api/docker-compose.yml down